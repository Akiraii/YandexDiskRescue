name: Yandex Disk Rescue - Windows executable
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.3'
      - name: Check source layout and helper checksum
        shell: pwsh
        run: |
          python qa/static-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Static validation failed' }
      - name: Audit locked Node dependencies
        shell: pwsh
        run: |
          Push-Location tools
          try {
            if (!(Test-Path package-lock.json)) { throw 'Missing committed dependency lock' }
            npm audit --omit=dev --audit-level=high
            if ($LASTEXITCODE -ne 0) { throw 'High/Critical npm vulnerability or audit unavailable' }
          } finally { Pop-Location }
      - name: Audit NuGet dependencies (including transitive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('YandexDiskRescue/YandexDiskRescue.csproj','Rescue.Worker/Rescue.Worker.csproj')) {
            dotnet restore $project -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=moderate
            if ($LASTEXITCODE -ne 0) { throw "NuGet restore/audit failed: $project" }
            $lines = dotnet list $project package --vulnerable --include-transitive --format json
            if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability enumeration failed: $project" }
            $data = ($lines -join "`n") | ConvertFrom-Json
            foreach ($pr in $data.projects) {
              foreach ($framework in $pr.frameworks) {
                foreach ($pkg in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if (!$pkg) { continue }
                  foreach ($v in @($pkg.vulnerabilities)) {
                    if ($v -and $v.severity -ge 2) { throw "NuGet moderate/high vulnerability: $($pkg.id) $($v.advisoryurl)" }
                  }
                }
              }
            }
          }
      - name: Security source regression checks
        shell: pwsh
        run: |
          python qa/security-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Security source regression detected' }
      - name: Download fixed rclone and verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-windows-amd64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'rclone-v1.75.2-windows-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '8A9DB2BAD1DC79A65B3348FD857069598E2AAB7CF4D118B77B1DF23055AFF818'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "rclone hash mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'rclone-unpacked'
          Expand-Archive -Path $archive -DestinationPath $extract
          $binary = Get-ChildItem $extract -Recurse -Filter 'rclone.exe' -File | Select-Object -First 1
          if (!$binary) { throw 'rclone executable missing from official ZIP' }
          Copy-Item $binary.FullName 'tools/rclone.exe'
          & 'tools/rclone.exe' version
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded rclone cannot run' }
      - name: Install Inno Setup 6 (installer builder)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installer dependency unavailable' }
      - name: Build Windows self-contained binaries, portable ZIP and installer
        shell: pwsh
        run: |
          & ./build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          if (!(Test-Path 'dist/app/YandexDiskRescue.exe')) { throw 'GUI EXE missing' }
          if (!(Test-Path 'dist/app/Rescue.Worker.exe')) { throw 'Worker EXE missing' }
          if (!(Test-Path 'dist/YandexDiskRescue-Portable.zip')) { throw 'Portable ZIP missing' }
          if (!(Test-Path 'dist/YandexDiskRescue-Setup.exe')) { throw 'Installer missing' }
      - name: Upload produced Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: YandexDiskRescue-Windows-x64
          path: |
            dist/YandexDiskRescue-Portable.zip
            dist/YandexDiskRescue-Setup.exe
            dist/SHA256-files.csv
          if-no-files-found: error
          retention-days: 14
